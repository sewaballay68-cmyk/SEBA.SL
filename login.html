<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SeBa.sl Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#d90000;
    margin-bottom:8px;
}

.logo span{
    color:#222;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

/* PASSWORD AREA */

.password-container{
    position:relative;
    width:100%;
}

.password-container input{
    width:100%;
    padding:14px 55px 14px 14px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    margin-bottom:15px;
}

.password-container input:focus{
    outline:none;
    border-color:#d90000;
}

/* SHOW PASSWORD BUTTON */

.show-password{
    position:absolute;
    right:8px;
    top:4px;
    width:45px;
    height:45px;
    border:none;
    background:white;
    font-size:22px;
    cursor:pointer;
    border-radius:8px;
}

.show-password:hover{
    background:#f0f2f5;
}

/* EMAIL */

.email-input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    margin-bottom:15px;
}

.email-input:focus{
    outline:none;
    border-color:#d90000;
}

/* LOGIN BUTTON */

.login-button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#d90000;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-button:hover{
    background:#b80000;
}

/* DIVIDER */

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
    color:#777;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    background:#ddd;
    flex:1;
}

/* SOCIAL BUTTONS */

.social-button{
    width:100%;
    padding:13px;
    border-radius:9px;
    margin-bottom:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.google{
    background:white;
    border:1px solid #ccc;
    color:#222;
}

.facebook{
    background:#1877f2;
    border:1px solid #1877f2;
    color:white;
}

.message{
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#d90000;
    font-weight:bold;
    text-decoration:none;
}

.home{
    text-align:center;
    margin-top:15px;
}

.home a{
    color:#555;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        SeBa<span>.sl</span>
    </div>

    <div class="subtitle">
        Welcome back to SeBa.sl
    </div>


    <div class="login-box">

        <h2>Login</h2>


        <!-- EMAIL -->

        <label>
            Email
        </label>

        <input
            class="email-input"
            type="email"
            id="email"
            placeholder="Enter your email"
        >


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <div class="password-container">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button
                type="button"
                class="show-password"
                id="showPasswordButton"
                onclick="togglePassword()"
            >
                👁️
            </button>

        </div>


        <!-- LOGIN -->

        <button
            type="button"
            class="login-button"
            onclick="loginUser()"
        >
            Login
        </button>


        <div class="divider">
            OR
        </div>


        <!-- GOOGLE -->

        <button
            type="button"
            class="social-button google"
            onclick="loginWithGoogle()"
        >
            🔵 Continue with Google
        </button>


        <!-- FACEBOOK -->

        <button
            type="button"
            class="social-button facebook"
            onclick="loginWithFacebook()"
        >
            f &nbsp; Continue with Facebook
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <div class="register">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>


        <div class="home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const button =
        document.getElementById(
            "showPasswordButton"
        );


    if(password.type === "password"){

        password.type = "text";

        button.innerHTML = "🙈";

    }
    else{

        password.type = "password";

        button.innerHTML = "👁️";

    }

}


/* =========================================
   LOGIN
========================================= */

async function loginUser(){

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if(!email || !password){

        document.getElementById("message")
            .textContent =
            "Please enter your email and password.";

        return;

    }


    document.getElementById("message")
        .textContent =
        "Logging in...";


    const {
        error
    } =
    await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        document.getElementById("message")
            .textContent =
            error.message;

        return;

    }


    document.getElementById("message")
        .textContent =
        "Login successful!";


    setTimeout(function(){

        window.location.href =
            "index.html";

    },700);

}


/* =========================================
   GOOGLE
========================================= */

async function loginWithGoogle(){

    const {
        error
    } =
    await supabaseClient.auth
        .signInWithOAuth({

            provider:"google",

            options:{
                redirectTo:
                    window.location.origin +
                    "/index.html"
            }

        });


    if(error){

        document.getElementById("message")
            .textContent =
            error.message;

    }

}


/* =========================================
   FACEBOOK
========================================= */

async function loginWithFacebook(){

    const {
        error
    } =
    await supabaseClient.auth
        .signInWithOAuth({

            provider:"facebook",

            options:{
                redirectTo:
                    window.location.origin +
                    "/index.html"
            }

        });


    if(error){

        document.getElementById("message")
            .textContent =
            error.message;

    }

}

</script>

</body>
</html>
